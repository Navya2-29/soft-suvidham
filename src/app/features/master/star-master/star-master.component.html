<app-header></app-header>
<app-spinner *ngIf="loading"></app-spinner>
<div class="vm-page">
<header class="vm-titlebar"><div class="vm-title-left"><a class="vm-back" routerLink="/dashboard" aria-label="Back to dashboard"><mat-icon>arrow_back</mat-icon></a><span class="vm-title-symbol"><mat-icon>auto_awesome</mat-icon></span><div><h1>Star Master</h1><p></p></div></div><span class="vm-header-note">Temple Management System</span></header>
<main class="vm-workspace"><div class="vm-layout"><section class="vm-panel vm-editor"><div class="vm-panel-title"><mat-icon>edit_note</mat-icon><span>Star Master Details</span></div><div class="vm-panel-body">
          <h1 style="font-weight: 500">Star Master</h1>
          <form [formGroup]="form">
            <table class="table">
              <tr>
                <td>
                  Star Code<span class="text-danger">*</span
                  ><input
                    type="text"
                    maxlength="3"
                    appUpperCase
                    matInput
                    formControlName="SM_Code"
                    class="form-control sps"
                    placeholder="Enter Code"
                    style="width: 126px"
                  />
                </td>
              </tr>

              <tr>
                <td>
                  Name<span class="text-danger">*</span
                  ><input
                    type="text"
                    appUpperCase
                    formControlName="SM_NameEng"
                    matInput
                    class="form-control"
                    placeholder="Enter Name"
                  />
                </td>
              </tr>
              <tr>
                <td>
                  In Regional Lan.<span class="text-danger">*</span
                  ><input
                    type="text"
                    appUpperCase
                    formControlName="SM_Name"
                    matInput
                    class="form-control"
                    placeholder="Enter Reg.Name"
                  />
                </td>
              </tr>

              <tr></tr>
              <div class="pl-1 text-danger"></div>
              <tr>
                <td>
                  
                  <!-- <button  class="btn btn-primary"
                    >Update</button> -->
                  
                </td>
              </tr>
            </table>
          </form>
        </div></section><section class="vm-panel vm-list-panel"><div class="vm-panel-title"><mat-icon>list_alt</mat-icon><span>Star Master List</span></div><div class="vm-list-area">
          <div style="display: flex" class="search-container mt-3 vm-search-container">
            <input
              type="text"
              class="form-control sps search-input"
              (input)="onSearch($event)"
              placeholder="search by Code or Name"
              style="width: 36%"
            />
            <mat-icon class="search-icon">search</mat-icon>
          </div>
          <div class="fixitems prathishta">
            <table class="table">
              <thead style="border-bottom: 2px solid #223d61">
                <!-- <th>Id</th> -->
                <th>code</th>
                <th>Name</th>
                <th>Regional</th>
                <th></th>
              </thead>
              <tbody>
                <tr
                  *ngFor="let item of filteredList; trackBy: trackById"
                  (click)="onSelect(item)"
                  [class.active]="selectedStar?.id === item.id"
                >
                  <td>{{ item.id || "-" }}</td>
                  <td>{{ item.SM_NameEng }}</td>
                  <td>{{ item.SM_Name }}</td>

                  <td>
                    <mat-icon
                      title="Edit"
                      class="small"
                      style="vertical-align: middle"
                      >edit</mat-icon
                    >
                  </td>
                </tr>
              </tbody>
              <tfoot *ngIf="starList.length==0">
                <tr>
                  <td colspan="5">
                    <div style="width: 100%" class="mt-3">
                      <h4 class="text-center">No Records found</h4>
                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div></section></div></main>
<footer class="vm-footer"><div class="vm-footer-right"><button type="button" class="vm-cancel-btn" class="btn btn-secondary ml-1" (click)="onCancel()">
                    Cancel
                  </button><button type="button" class="vm-save-btn"
                    class="btn btn-primary"
                    (click)="onUpdate()"
                    [disabled]="!selectedStar"
                  >
                    Update
                  </button></div></footer>
</div>
