<app-header></app-header>
<app-spinner *ngIf="loading"></app-spinner>

<div class="report-container">

<div class="icon-container">
  <button mat-icon-button matTooltip="Back to previous page" (click)="goBack()">
    <span class="material-icons">arrow_back</span>
  </button>
  <button mat-icon-button matTooltip="Make PDF" (click)="generatePDF()">
    <span class="material-icons">print</span>
  </button>
  <!-- <button mat-icon-button matTooltip="Export to Spreadsheet" >
        <span class="material-icons">grid_view</span>
    </button> -->
</div>
<div id="print-section">
  <div class="header-print">
    <h3 class="templename"
    >
      {{ templeName }}
    </h3>
    <h4 
    >
      {{ templeAddress }}
    </h4>

    <h2  
    >
      Vihidham List
    </h2>
    <!-- <p
     class="date"
    >
      {{ formatDateToDDMMYYYY(fromDate) }} to {{ formatDateToDDMMYYYY(toDate) }}
    </p> -->
    <hr/>
  </div>
  

  <div class="body-print">
    <div id="pdf-content" *ngIf="data.length > 0"> 
   <div class="vazhipad-upi">
    <!-- <h4 class="tabble-heading">{{"VAZHIPAD" | translate }}</h4> -->
    <table>
      <thead>
        <tr>
          <!-- <th>{{ "BILL NO" | translate }}</th>
          <th>{{ "BILLDATE" | translate }}</th>
          <th>{{ "Counter" | translate}}</th> -->
          <th>Vazhipad</th>

          <th >Vihidham Type</th>   
                              <th class="number" >Rate</th>
                              <th >From date</th>
                              <th >To date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of data">
            <td >{{getVazhipadNameById(data.VazhId)}}</td>
            <td >{{data.VC_Name}}</td>
            <td >{{data.Rate}}</td>
            <td>{{data.FDate | date:'dd-MM-yyyy' }}</td>
            <td>{{data.ToDate  | date:'dd-MM-yyyy' }}</td>
        </tr>  
      </tbody>
    </table>
   </div>
    </div>
    <div class="nodataFound" *ngIf="data.length === 0">
      <h2></h2>
    </div>
    <hr />
  </div>
</div>
</div>
