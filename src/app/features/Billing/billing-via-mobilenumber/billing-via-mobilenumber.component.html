<div class="dialog-header">
    <span>Mobile: {{ mobileNumber }}</span>
  </div>
  
  <div class="dialog-body" *ngIf="!noDataFound" style="font-family:Manjari;">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;font-family: Manjari;" >
      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            (change)="$event ? masterToggle() : null"
            [checked]="isAllSelected()"
            [indeterminate]="isIndeterminate()"
          ></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox
            (click)="$event.stopPropagation()"
            (change)="$event ? toggleSelection(element) : null"
            [checked]="isSelected(element)"
          >
          </mat-checkbox>
        </td>
      </ng-container>
  
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> {{"NAME" | translate }} </th>
        <td mat-cell *matCellDef="let element"> {{ element.Name }} </td>
      </ng-container>
  
      <!-- Star Columnthis.dataSource -->
      <ng-container matColumnDef="star">
        <th mat-header-cell *matHeaderCellDef> {{"STAR" | translate }} </th>
        <td mat-cell *matCellDef="let element"> {{ element.Star }} </td>
      </ng-container>
      <ng-container matColumnDef="">
        <th mat-header-cell *matHeaderCellDef> {{"STAR" | translate }} </th>
        <td mat-cell *matCellDef="let element"> {{ element.Star }} </td>
      </ng-container>
  
      <!-- Header Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <!-- Data Row -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    
  </div>
  <div *ngIf="noDataFound">
    <p class="no-data-message">No data found for this number</p>
  </div>
  <div class="dialog-footer">
    <button mat-button color="primary" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" class="btn btn-info" (click)="onSubmit(false)">Submit</button>
    <!-- <button mat-raised-button color="primary" class="btn btn-info" (click)="onSubmit(true)">Multi Day</button> -->
  </div>
