<div class="dialog-container">
  <h2 mat-dialog-title>Change Password</h2>
  <form [formGroup]="changepasswordForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Old password</mat-label>
      <input matInput placeholder="Enter old password" formControlName="oldPassword" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New password</mat-label>
      <input matInput placeholder="Enter new password" formControlName="newPassword" required />
      <mat-error *ngIf="changepasswordForm.get('newPassword')?.invalid && changepasswordForm.get('newPassword')?.touched">
        New Password must be at least 6 characters
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm Password</mat-label>
      <input matInput placeholder="Enter new password" formControlName="confirmPassword" required />
      <mat-error *ngIf="changepasswordForm.get('confirmPassword')?.hasError('required')">
        Confirm password is required
      </mat-error>
      <mat-error *ngIf="changepasswordForm.hasError('passwordMismatch')">
        Passwords do not match
      </mat-error>

    </mat-form-field>
  </form>
  <div class="dialog-actions">
    <button mat-flat-button class="custom-button" style="background-color: red;border: none;" (click)="onReset()">
      Cancel
    </button>
    <button mat-flat-button color="primary" class="custom-button ml-3" (click)="onSubmit()">
      Submit
    </button>
  </div>
</div>
